name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BLOGFACTORY_VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blogfactory-api:${{ env.BLOGFACTORY_VERSION }}
            ghcr.io/${{ github.repository_owner }}/blogfactory-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/blogfactory-web:${{ env.BLOGFACTORY_VERSION }}
            ghcr.io/${{ github.repository_owner }}/blogfactory-web:latest
